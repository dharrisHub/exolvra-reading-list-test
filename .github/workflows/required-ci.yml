name: Reading List CI

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  framework-build:
    name: framework-build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with:
          dotnet-version: 10.0.x
      - name: Build the exact saved source
        run: dotnet build Application.csproj --configuration Release --ignore-failed-sources
